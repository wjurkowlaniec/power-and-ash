// Koncept arty kluczowych miejsc. Ujęcie wybiera hash: #hala #stacja #bojerek #wies #slupy #zalew #cerkwiska
import * as THREE from 'three';
const shot=(location.hash||'#stacja').slice(1);
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,600);

let seed=11;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.85,metalness:o.m??0.1,flatShading:o.flat??true,emissive:o.e??0,emissiveIntensity:o.ei??1,transparent:o.t!=null,opacity:o.t??1,side:o.ds?THREE.DoubleSide:THREE.FrontSide});
const mk=(g,m,x=0,y=0,z=0,sh=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;return o};
const box=(w,h,d,m,x=0,y=0,z=0)=>mk(new THREE.BoxGeometry(w,h,d),m,x,y,z);
const cyl=(rt,rb,h,m,x=0,y=0,z=0,s=8)=>mk(new THREE.CylinderGeometry(rt,rb,h,s),m,x,y,z);
const add=(...o)=>{o.forEach(x=>scene.add(x));return o[0]};

const BATT=0x7dffb0, SODIUM=0xffa04a;
const steel=M(0x5a6168,{r:0.6,m:0.6}), rust=M(0x6e4a36,{r:0.9,m:0.3}), dark=M(0x26292d,{r:0.7,m:0.4});
const concrete=M(0x8f8b84,{r:1}), wood=M(0x5b4a3c,{r:1}), woodDark=M(0x3a3029,{r:1});

function setup({sky,fog,fogNear,fogFar,sun,sunI,sunPos,hemi,exp}){
 scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(fog??sky,fogNear,fogFar);
 renderer.toneMappingExposure=exp??1;
 scene.add(new THREE.HemisphereLight(...hemi));
 const s=new THREE.DirectionalLight(sun,sunI);s.position.set(...sunPos);s.castShadow=true;
 s.shadow.mapSize.set(2048,2048);Object.assign(s.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});s.shadow.bias=-0.0006;
 scene.add(s);return s;}

function ground(col,amp=1,size=300,f=0.04){const g=new THREE.PlaneGeometry(size,size,150,150);g.rotateX(-Math.PI/2);
 const p=g.attributes.position;const h=(x,z)=>(Math.sin(x*f+z*f*0.6)*0.9+Math.sin(x*f*0.4-z*f*1.3)*1.4+Math.sin(z*f*3)*0.2)*amp;
 for(let i=0;i<p.count;i++)p.setY(i,h(p.getX(i),p.getZ(i)));g.computeVertexNormals();
 add(mk(g,M(col,{r:1}),0,0,0,false));return h;}

// Wolt: niski automat serwisowy, jedno oko, zielone serce-bateria, lampa sodowa
function wolt(x,y,z,ry=0,{lamp=false,lampI=6,batt=1,scale=1}={}){const g=new THREE.Group();
 const body=M(0xb9b3a6,{r:0.7,m:0.3}),joint=M(0x3a3e43,{m:0.5,r:0.6});
 g.add(box(0.22,0.55,0.26,joint,-0.22,0.28,0));g.add(box(0.22,0.55,0.26,joint,0.22,0.28,0));
 g.add(box(0.8,0.75,0.6,body,0,0.92,0));
 g.add(box(0.28,0.28,0.06,M(0,{e:BATT,ei:2.5*batt}),0,0.95,0.31));
 g.add(box(0.12,0.5,0.14,joint,-0.5,0.85,0.05));g.add(box(0.12,0.5,0.14,joint,0.5,0.85,0.05));
 g.add(box(0.56,0.4,0.48,body,0,1.55,0));
 g.add(cyl(0.11,0.11,0.08,M(0x111111,{e:0xd8e8e0,ei:1.2}),0,1.57,0.25).rotateX(Math.PI/2));
 g.add(box(0.06,0.35,0.06,joint,0.2,1.9,-0.1));
 if(lamp){g.add(mk(new THREE.SphereGeometry(0.09,8,6),M(0,{e:SODIUM,ei:4}),0.2,2.1,-0.1,false));
  const L=new THREE.PointLight(SODIUM,lampI,16,1.6);L.position.set(0.2,2.1,0.2);g.add(L);}
 const bl=new THREE.PointLight(BATT,1.2*batt,4,2);bl.position.set(0,0.95,0.6);g.add(bl);
 g.traverse(o=>{if(o.isMesh){o.castShadow=true}});
 g.position.set(x,y,z);g.rotation.y=ry;g.scale.setScalar(scale);scene.add(g);return g;}

function human(x,y,z,ry=0){const g=new THREE.Group();const cloth=M(0x4a4740,{r:1}),mask=M(0x2a2a2a,{r:0.6});
 const coat=mk(new THREE.ConeGeometry(0.45,1.5,7),cloth,0,0.75,0);g.add(coat);
 g.add(mk(new THREE.SphereGeometry(0.2,8,6),mask,0,1.65,0));g.add(mk(new THREE.ConeGeometry(0.32,0.35,7),cloth,0,1.85,0));
 g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);return g;}

function tree(x,y,z,h=5,col=0x3d3a33){const g=new THREE.Group();g.add(cyl(0.08,0.14,h*0.5,woodDark,0,h*0.25,0,5));
 for(let i=0;i<3;i++){const c=mk(new THREE.IcosahedronGeometry(h*0.22*(1-i*0.15),0),M(col),(rnd()-0.5)*0.6,h*(0.5+i*0.17),(rnd()-0.5)*0.6);g.add(c);}
 g.position.set(x,y,z);scene.add(g);return g;}

function pylon(x,y,z,h,tilt=0,ry=0,m=rust){const g=new THREE.Group();const b=1.2;
 for(const [dx,dz] of [[-1,-1],[1,-1],[1,1],[-1,1]]){const l=box(0.14,h,0.14,m,dx*b*0.6,h/2,dz*b*0.6);g.add(l);}
 for(let yy=1.2;yy<h;yy+=1.5){g.add(box(b*1.3,0.08,0.08,m,0,yy,-b*0.6));g.add(box(b*1.3,0.08,0.08,m,0,yy,b*0.6));g.add(box(0.08,0.08,b*1.3,m,-b*0.6,yy,0));g.add(box(0.08,0.08,b*1.3,m,b*0.6,yy,0));}
 g.add(box(5,0.16,0.16,m,0,h,0));g.add(box(3.4,0.14,0.14,m,0,h-1.6,0));
 g.position.set(x,y,z);g.rotation.set(0,ry,tilt);scene.add(g);return g;}

function wire(a,b,sag,m=M(0x2a2420,{r:0.5,m:0.6}),r=0.03){const pts=[];for(let i=0;i<=24;i++){const t=i/24;const p=a.clone().lerp(b,t);p.y-=Math.sin(t*Math.PI)*sag;pts.push(p);}
 add(mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),48,r,5),m,0,0,0,false));}

function particles(n,area,col,size,y0,y1,opacity=0.6){const g=new THREE.BufferGeometry();const a=new Float32Array(n*3);
 for(let i=0;i<n;i++){a[i*3]=(rnd()-0.5)*area[0]+area[2];a[i*3+1]=y0+rnd()*(y1-y0);a[i*3+2]=(rnd()-0.5)*area[1]+area[3];}
 g.setAttribute('position',new THREE.BufferAttribute(a,3));
 add(new THREE.Points(g,new THREE.PointsMaterial({color:col,size,transparent:true,opacity,depthWrite:false,sizeAttenuation:true})));}

function churchTower(x,y,z,h){const g=new THREE.Group();const wall=M(0xa29b8f,{r:1}),roof=M(0x44403a,{r:0.9,m:0.2});
 g.add(box(3,h,3,wall,0,h/2,0));g.add(box(3.3,0.3,3.3,wall,0,h*0.62,0));
 for(const s of [-1,1]){g.add(box(0.5,1.4,0.1,dark,s*0.6,h-1.6,1.51));}
 const sp=mk(new THREE.ConeGeometry(2.3,h*0.55,4),roof,0,h+h*0.27,0);sp.rotation.y=Math.PI/4;g.add(sp);
 g.add(box(0.08,1.2,0.08,steel,0,h+h*0.6,0));g.add(box(0.6,0.08,0.08,steel,0,h+h*0.62,0));
 g.position.set(x,y,z);scene.add(g);return g;}

function cottage(x,y,z,ry=0,s=1){const g=new THREE.Group();const w=M(0x6e6255,{r:1}),roof=M(0x55504a,{r:1});
 g.add(box(4,2.2,3,w,0,1.1,0));const r=mk(new THREE.CylinderGeometry(0.01,2.4,1.8,4,1),roof,0,3.1,0);r.rotation.y=Math.PI/4;r.scale.set(1.3,1,0.95);g.add(r);
 g.add(box(0.7,0.8,0.05,M(0x1a1a1a),1,1.3,1.52));g.add(box(0.7,0.8,0.05,M(0x1a1a1a),-1,1.3,1.52));
 g.position.set(x,y,z);g.rotation.y=ry;g.scale.setScalar(s);scene.add(g);return g;}

function water(col,y=0,rough=0.15){const g=new THREE.PlaneGeometry(600,600);g.rotateX(-Math.PI/2);
 const w=mk(g,new THREE.MeshStandardMaterial({color:col,roughness:rough,metalness:0.6,transparent:true,opacity:0.92}),0,y,0,false);scene.add(w);return w;}

function iceYacht(x,y,z,ry,{sailCol=0xd8743a,sailTorn=true}={}){const g=new THREE.Group();const fr=M(0x6d6559,{r:0.8,m:0.4});
 g.add(box(6,0.18,0.3,fr,0.5,0.55,0));g.add(box(0.3,0.18,4.2,fr,-0.6,0.55,0));
 const run=(px,pz)=>{g.add(box(1.4,0.08,0.1,steel,px,0.12,pz));g.add(box(0.12,0.4,0.12,fr,px,0.33,pz));};
 run(3.3,0);run(-0.6,-2);run(-0.6,2);
 g.add(box(1.4,0.35,1,M(0x7d7466),-1.6,0.75,0));
 g.add(box(0.5,0.4,0.6,M(0x3a3e43,{m:0.5}),1.4,0.8,0));
 g.add(cyl(0.07,0.09,5.5,steel,0.6,3.3,0,6));
 const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(0,4.6);
 if(sailTorn){sh.lineTo(1.2,3.2);sh.lineTo(1.0,2.9);sh.lineTo(2.6,1.0);sh.lineTo(2.2,0.7);sh.lineTo(3,0.1);}else sh.lineTo(3,0.1);
 sh.lineTo(0,0);
 const sail=mk(new THREE.ShapeGeometry(sh),M(sailCol,{r:0.7,ds:true,flat:false}),0.62,0.9,0);sail.rotation.y=Math.PI*0.75;g.add(sail);
 g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);return g;}

function lookFrom(p,t){cam.position.set(...p);cam.lookAt(...t);}
